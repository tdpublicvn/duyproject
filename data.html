<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quiz Data</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:18px;background:#fffafb}
    pre{white-space:pre-wrap;background:#fff;border:1px solid #eee;padding:12px;border-radius:8px}
    button{padding:8px 12px;border-radius:8px;border:none;background:#ff5e7e;color:#fff;font-weight:700;cursor:pointer;margin-right:8px}
  </style>
</head>
<body>
  <h2>Quiz Log</h2>
  <p>Hiển thị dữ liệu lưu trong localStorage: `quiz_log`, `q1`..`q5_text`.</p>
  <div>
    <button id="refresh">Làm mới</button>
    <button id="download">Tải JSON</button>
    <button id="clear">Xóa log</button>
  </div>
  <h3>Dữ liệu</h3>
  <pre id="out">(chưa có dữ liệu)</pre>

  <script>
    const out = document.getElementById('out');
    function load(){
      const log = JSON.parse(localStorage.getItem('quiz_log') || '{}');
      const q1 = localStorage.getItem('q1') || null;
      const q2 = localStorage.getItem('q2') || null;
      const q3 = localStorage.getItem('q3') || null;
      const q4 = localStorage.getItem('q4') || null;
      const q5_text = localStorage.getItem('q5_text') || null;
      const data = {log,q1,q2,q3,q4,q5_text};
      out.textContent = JSON.stringify(data, null, 2);
    }
    document.getElementById('refresh').addEventListener('click', load);
    document.getElementById('download').addEventListener('click', ()=>{
      const blob = new Blob([out.textContent], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'quiz_data.json'; a.click(); URL.revokeObjectURL(url);
    });
    document.getElementById('clear').addEventListener('click', ()=>{ localStorage.removeItem('quiz_log'); localStorage.removeItem('q1'); localStorage.removeItem('q2'); localStorage.removeItem('q3'); localStorage.removeItem('q4'); localStorage.removeItem('q5_text'); load(); });
    load();
  </script>
</body>
</html>
