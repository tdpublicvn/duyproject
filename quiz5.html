<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Nunito',sans-serif}
        body{background:linear-gradient(135deg,#ffdde1 0%,#ee9ca7 100%);height:100vh;display:flex;justify-content:center;align-items:center}
        .card{background:rgba(255,255,255,.9);padding:28px;border-radius:20px;max-width:520px;width:94%;text-align:left;box-shadow:0 10px 30px rgba(238,156,167,.35)}
        h2{color:#ff5e7e;margin-bottom:6px;text-align:center}
        p{color:#666;margin-bottom:16px;text-align:center}
        .options{display:grid;gap:10px;margin-top:8px}
        .opt{padding:12px;border-radius:12px;border:2px solid #ffd7e0;background:#fffafb;color:#ff5e7e;cursor:pointer;font-weight:700}
        .opt:hover{background:#fff}
        .foot{display:flex;gap:12px;margin-top:18px}
        .btn{flex:1;padding:10px;border-radius:12px;border:none;background:#ff5e7e;color:#fff;font-weight:700;cursor:pointer}
    </style>
</head>
<body>
    <div class="card">
        <h2>Câu 5</h2>
        <p>Em có muốn gửi cho ba hay nhắn nhủ gì đó cho ba honggg</p>
        <div style="margin-top:12px">
            <textarea id="answerText" placeholder="Viết câu trả lời dài ở đây..." style="width:100%;height:240px;border-radius:12px;border:2px solid #ffd7e0;padding:12px;font-family:'Nunito',sans-serif;font-size:15px;color:#333;background:#fffafb"></textarea>
        </div>

        <div id="explain" style="display:none;margin-top:12px;padding:12px;border-radius:10px;background:#fff;border:1px solid #ffd7e0;color:#333"></div>

        <div class="foot">
            <button class="btn" id="prevBtn">Trước</button>
            <button class="btn" id="submitBtn" disabled>Gửi & Tiếp →</button>
        </div>
    </div>

    <script>
        const answerText = document.getElementById('answerText');
        const explainEl = document.getElementById('explain');
        const submitBtn = document.getElementById('submitBtn');
        const prevBtn = document.getElementById('prevBtn');

        function pushAttempt(q, val, correct){
            const key = 'quiz_log';
            const raw = localStorage.getItem(key);
            const log = raw ? JSON.parse(raw) : {};
            log[q] = log[q] || [];
            log[q].push({value: val, correct: !!correct, time: Date.now()});
            localStorage.setItem(key, JSON.stringify(log));
        }

        // enable submit when textarea has content
        answerText.addEventListener('input', ()=>{
            submitBtn.disabled = !answerText.value.trim();
        });

        // restore previous text if exists
        (function restore(){
            const prev = localStorage.getItem('q5_text');
            if(prev){
                answerText.value = prev;
                submitBtn.disabled = false;
                explainEl.innerHTML = 'Bạn đã trả lời trước đó.';
                explainEl.style.display = 'block';
            }
        })();

        prevBtn.addEventListener('click', ()=> window.location.href = 'explain4.html');

        submitBtn.addEventListener('click', ()=>{
            const text = answerText.value.trim();
            if(!text) return;
            // save text and log
            localStorage.setItem('q5_text', text);
            pushAttempt('q5', text, true);
            explainEl.innerHTML = 'Cám ơn! Đáp án đã được lưu.';
            explainEl.style.display = 'block';
            setTimeout(()=> window.location.href = 'explain5.html', 700);
        });
    </script>
</body>
</html>
